name: Deploy Frontend Innovatech
on:
  push:
    branches: [ deploy ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest

      - name: Desplegar en AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Limpiar versiones anteriores para forzar el refresco de variables
            sudo docker stop front-app || true
            sudo docker rm front-app || true
            sudo docker image rm ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest || true
            
            # Bajar la versión nueva
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest
            
            # Correr con la IP del Backend de Cathi (Indicador IE7)
            sudo docker run -d --name front-app -p 80:5000 -e BACKEND_URL="http://10.0.2.62:3000" ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest